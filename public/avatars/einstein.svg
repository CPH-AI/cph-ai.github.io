<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Albert Einstein">
  <rect width="240" height="240" fill="#ece6d6"/>

  <!-- Dice motif (top-right) -->
  <g transform="translate(202 38) rotate(15)">
    <path d="M -14 -14 L 0 -19 L 14 -14 L 14 8 L 0 13 L -14 8 Z" fill="#ece6d6" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 0 -19 L 0 13" stroke="#1a1a1a" stroke-width="1.4"/>
    <path d="M -14 -14 L 0 -8 L 14 -14" stroke="#1a1a1a" stroke-width="1.4" fill="none"/>
    <circle cx="-7" cy="-3" r="1.2" fill="#1a1a1a"/>
    <circle cx="-7" cy="2" r="1.2" fill="#1a1a1a"/>
    <circle cx="6" cy="-3" r="1.2" fill="#1a1a1a"/>
  </g>

  <!-- Wild hair: spiky lines emanating up -->
  <g stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M 80 100 Q 76 70 65 50"/>
    <path d="M 92 88 Q 86 58 75 38"/>
    <path d="M 104 80 Q 100 50 92 28"/>
    <path d="M 116 76 Q 116 45 113 25"/>
    <path d="M 128 76 Q 130 45 132 25"/>
    <path d="M 140 80 Q 144 50 150 30"/>
    <path d="M 152 88 Q 158 58 168 40"/>
    <path d="M 164 100 Q 174 75 190 60"/>
    <!-- Billowy side wisps -->
    <path d="M 70 115 Q 48 105 28 115"/>
    <path d="M 65 130 Q 38 130 18 145"/>
    <path d="M 70 148 Q 42 152 22 170"/>
    <path d="M 78 165 Q 55 175 38 192"/>
    <path d="M 175 115 Q 197 105 217 115"/>
    <path d="M 180 130 Q 207 130 227 145"/>
    <path d="M 175 148 Q 203 152 223 170"/>
    <path d="M 167 165 Q 190 175 207 192"/>
  </g>

  <!-- Face -->
  <ellipse cx="122" cy="138" rx="46" ry="52" fill="#ece6d6" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Heavy eyebrows -->
  <path d="M 92 128 Q 103 123 116 130" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 130 130 Q 143 123 154 128" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="104" cy="139" rx="2.4" ry="2" fill="#1a1a1a"/>
  <ellipse cx="142" cy="139" rx="2.4" ry="2" fill="#1a1a1a"/>

  <!-- Nose -->
  <path d="M 122 148 Q 119 162 115 168 Q 119 171 124 169" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Mouth (skeptical, slight downward curve - "신은 주사위를 던지지 않는다") -->
  <path d="M 110 182 Q 122 179 134 182" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Suit shoulders -->
  <path d="M 48 240 L 68 205 L 90 193 L 122 202 L 154 193 L 176 205 L 196 240 Z" fill="#1a1a1a"/>

  <!-- Shirt V -->
  <path d="M 108 200 L 122 224 L 136 200 L 128 195 L 122 200 L 116 195 Z" fill="#ece6d6"/>
  <!-- Tie -->
  <path d="M 118 202 L 122 222 L 126 202 L 122 199 Z" fill="#1a1a1a"/>
</svg>
