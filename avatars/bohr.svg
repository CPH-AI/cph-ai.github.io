<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Niels Bohr">
  <rect width="240" height="240" fill="#ece6d6"/>

  <!-- Atom motif (top-right, signature) -->
  <g transform="translate(200 42)">
    <g fill="none" stroke="#1a1a1a" stroke-width="1.3" opacity="0.75">
      <ellipse rx="16" ry="5.5"/>
      <ellipse rx="16" ry="5.5" transform="rotate(60)"/>
      <ellipse rx="16" ry="5.5" transform="rotate(-60)"/>
    </g>
    <g fill="#1a1a1a">
      <circle cx="-16" cy="0" r="1.5"/>
      <circle cx="8" cy="-4.6" r="1.5"/>
      <circle cx="8" cy="4.6" r="1.5"/>
      <circle r="1.8"/>
    </g>
  </g>

  <!-- Hair (clean, slightly receding, parted) -->
  <path d="M 78 95 Q 78 68 100 60 Q 122 56 145 62 Q 165 70 168 95 Q 165 100 148 95 Q 138 90 122 92 Q 105 90 92 96 Q 80 100 78 95 Z" fill="#1a1a1a"/>

  <!-- Face -->
  <ellipse cx="122" cy="125" rx="42" ry="50" fill="#ece6d6" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Brow lines -->
  <path d="M 100 124 Q 110 121 118 125" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 126 125 Q 134 121 144 124" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Eyes (calm, kindly) -->
  <ellipse cx="106" cy="132" rx="2.2" ry="1.8" fill="#1a1a1a"/>
  <ellipse cx="138" cy="132" rx="2.2" ry="1.8" fill="#1a1a1a"/>

  <!-- Nose -->
  <path d="M 122 138 Q 120 152 116 158 Q 120 161 124 159" stroke="#1a1a1a" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Mouth (subtle, contemplative) -->
  <path d="M 110 172 Q 122 175 134 172" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Suit shoulders -->
  <path d="M 48 240 L 68 205 L 90 193 L 122 202 L 154 193 L 176 205 L 196 240 Z" fill="#1a1a1a"/>

  <!-- Shirt V -->
  <path d="M 108 200 L 122 224 L 136 200 L 128 195 L 122 200 L 116 195 Z" fill="#ece6d6"/>
  <!-- Tie -->
  <path d="M 118 202 L 122 222 L 126 202 L 122 199 Z" fill="#1a1a1a"/>
</svg>
