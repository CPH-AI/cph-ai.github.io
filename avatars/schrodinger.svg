<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Erwin Schrödinger">
  <rect width="240" height="240" fill="#ece6d6"/>

  <!-- Box with cat (top-right) -->
  <g transform="translate(195 42)">
    <rect x="-26" y="-18" width="52" height="36" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 2"/>
    <g transform="translate(0 4)" fill="#1a1a1a">
      <path d="M -8 -10 L -5 -3 L -2 -8 Z"/>
      <path d="M 8 -10 L 5 -3 L 2 -8 Z"/>
      <ellipse cx="0" cy="-2" rx="6" ry="5"/>
      <path d="M -7 1 Q -8 8 -5 10 L 5 10 Q 8 8 7 1 Z"/>
      <path d="M 7 6 Q 13 4 12 -2" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hair (natural swept-back) -->
  <path d="M 76 95
           Q 70 55 122 50
           Q 174 55 168 95
           Q 154 88 138 92
           Q 122 88 106 92
           Q 90 88 76 95 Z" fill="#1a1a1a"/>

  <!-- Face -->
  <ellipse cx="122" cy="124" rx="40" ry="48" fill="#ece6d6" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Round glasses (signature) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2.4">
    <circle cx="105" cy="128" r="12" fill="#ece6d6"/>
    <circle cx="139" cy="128" r="12" fill="#ece6d6"/>
    <line x1="117" y1="128" x2="127" y2="128"/>
    <path d="M 93 128 Q 86 125 82 124"/>
    <path d="M 151 128 Q 158 125 162 124"/>
  </g>

  <!-- Eyes (small, behind glasses) -->
  <circle cx="105" cy="128" r="1.6" fill="#1a1a1a"/>
  <circle cx="139" cy="128" r="1.6" fill="#1a1a1a"/>

  <!-- Nose -->
  <path d="M 122 142 Q 119 154 116 160 Q 120 162 124 160" stroke="#1a1a1a" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Mouth (neutral, contemplative) -->
  <path d="M 112 172 Q 122 174 132 172" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Suit shoulders -->
  <path d="M 48 240 L 68 205 L 90 193 L 122 202 L 154 193 L 176 205 L 196 240 Z" fill="#1a1a1a"/>

  <!-- Shirt V -->
  <path d="M 108 200 L 122 224 L 136 200 L 128 195 L 122 200 L 116 195 Z" fill="#ece6d6"/>
  <!-- Tie -->
  <path d="M 118 202 L 122 222 L 126 202 L 122 199 Z" fill="#1a1a1a"/>
</svg>
